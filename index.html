<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Picture of the Day</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f1a; color: #e8ecf5; }
    header { padding: 1.5rem 1rem; text-align: center; }
    h1 { margin: 0 0 .25rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; padding: 0 1rem 1rem; }
    input, select, button { padding: .6rem .8rem; border-radius: 6px; border: 1px solid #3a4560; background: #151b2e; color: inherit; font: inherit; }
    button { background: #2a5bd7; border-color: #2a5bd7; cursor: pointer; }
    button:hover { background: #3b6ae6; }
    #status { text-align: center; min-height: 1.5rem; padding: 0 1rem; }
    #status.error { color: #ff8a8a; }
    #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 1rem; max-width: 1100px; margin: 0 auto; }
    .card { background: #151b2e; border-radius: 10px; overflow: hidden; }
    .card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #222a42; }
    .card .body { padding: .8rem 1rem 1rem; }
    .card h2 { font-size: 1.05rem; margin: 0 0 .25rem; }
    .card .date { color: #9aa6c4; font-size: .85rem; margin: 0 0 .5rem; }
    .card p { font-size: .9rem; line-height: 1.4; margin: 0 0 .5rem; }
    a { color: #7fb0ff; }
  </style>
</head>
<body>
  <header>
    <h1>NASA Picture of the Day</h1>
    <p>Data from the NASA APOD API</p>
  </header>

  <div class="controls">
    <select id="mode" aria-label="What to load">
      <option value="today">Today</option>
      <option value="date">Pick a date</option>
      <option value="random">Random pictures</option>
      <option value="range">Date range</option>
    </select>
    <input type="date" id="date" aria-label="Date of the picture" hidden />
    <input type="number" id="count" min="1" max="25" value="6" aria-label="How many random pictures" hidden />
    <input type="date" id="start" aria-label="Start date" hidden />
    <input type="date" id="end" aria-label="End date" hidden />
    <button id="load">Load</button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <main id="results"></main>

  <script>
    // 1. SETTINGS ---------------------------------------------------------
    // Get a free key at api.nasa.gov and paste it here. DEMO_KEY only allows
    // 30 requests/hour and 50/day, so replace it for real use.
    const API_KEY = "DEMO_KEY";
    const BASE_URL = "https://science.nasa.gov/wp-json/wp/v2/apod-basic/";
    const CACHE_MINUTES = 60;

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const resultsEl = $("results");

    // 2. BUILD THE URL ----------------------------------------------------
    function buildUrl() {
      const params = new URLSearchParams({ api_key: API_KEY });
      const mode = $("mode").value;

      if (mode === "date") {
        if (!$("date").value) throw new Error("Choose a date.");
        params.set("date", $("date").value);
      } else if (mode === "random") {
        // count cannot be combined with date, start_date or end_date
        params.set("count", Math.min(25, Math.max(1, Number($("count").value) || 6)));
      } else if (mode === "range") {
        if (!$("start").value) throw new Error("Choose a start date.");
        params.set("start_date", $("start").value);
        if ($("end").value) params.set("end_date", $("end").value);
      }
      return `${BASE_URL}?${params}`;
    }

    // 3. FETCH WITH CACHE + ERROR HANDLING --------------------------------
    async function getData(url) {
      // Cache by URL so repeat loads don't use up the rate limit.
      // The key is removed from the cache name so it is never stored twice.
      const cacheKey = "apod:" + url.replace(/api_key=[^&]+/, "");
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey));
        if (cached && Date.now() - cached.time < CACHE_MINUTES * 60000) {
          return cached.data;
        }
      } catch (e) { /* ignore a bad cache */ }

      const res = await fetch(url);

      if (res.status === 429) {
        throw new Error("Rate limit reached. Wait an hour or use your own API key.");
      }
      if (res.status === 403) {
        throw new Error("The API key was rejected. Check API_KEY.");
      }
      if (!res.ok) {
        throw new Error(`Request failed (${res.status}).`);
      }

      const remaining = res.headers.get("X-RateLimit-Remaining");
      if (remaining !== null) console.log("Requests left this hour:", remaining);

      const data = await res.json();
      try {
        localStorage.setItem(cacheKey, JSON.stringify({ time: Date.now(), data }));
      } catch (e) { /* storage full or disabled */ }
      return data;
    }

    // 4. PICK FIELDS SAFELY -----------------------------------------------
    // The exact field names can differ, so check each one in turn.
    // Open DevTools > Console to see the full object and adjust if needed.
    function pickImage(item) {
      const candidates = [item.hdurl, item.url, item.image, item.thumbnail, item.thumbnail_url];
      for (const c of candidates) {
        if (typeof c === "string" && /^https?:/.test(c)) return c;
        if (c && typeof c.url === "string") return c.url;
      }
      return "";
    }

    function plainText(value) {
      if (!value) return "";
      const raw = typeof value === "string" ? value : value.rendered || "";
      const div = document.createElement("div");
      div.innerHTML = raw;
      return div.textContent.trim();
    }

    // 5. SHOW THE RESULTS (safely, with textContent) ----------------------
    function render(items) {
      resultsEl.replaceChildren();

      items.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";

        const imgUrl = pickImage(item);
        if (imgUrl) {
          const img = document.createElement("img");
          img.src = imgUrl;
          img.alt = plainText(item.title) || "NASA picture";
          img.loading = "lazy";
          card.append(img);
        }

        const body = document.createElement("div");
        body.className = "body";

        const title = document.createElement("h2");
        title.textContent = plainText(item.title) || "Untitled";

        const date = document.createElement("p");
        date.className = "date";
        date.textContent = item.date || "";

        body.append(title, date);

        const text = plainText(item.explanation || item.excerpt);
        if (text) {
          const p = document.createElement("p");
          p.textContent = text.length > 220 ? text.slice(0, 220) + "…" : text;
          body.append(p);
        }

        const link = item.permalink || item.link;
        if (link) {
          const a = document.createElement("a");
          a.href = link;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = "Read more";
          body.append(a);
        }

        card.append(body);
        resultsEl.append(card);
      });
    }

    // 6. PUT IT TOGETHER ---------------------------------------------------
    async function load() {
      statusEl.className = "";
      statusEl.textContent = "Loading…";
      resultsEl.replaceChildren();

      try {
        const data = await getData(buildUrl());
        console.log("API response:", data);
        const items = Array.isArray(data) ? data : [data];
        render(items);
        statusEl.textContent = `Showing ${items.length} item${items.length === 1 ? "" : "s"}.`;
      } catch (err) {
        statusEl.className = "error";
        statusEl.textContent = err.message || "Something went wrong.";
      }
    }

    // Show or hide inputs depending on the mode
    $("mode").addEventListener("change", () => {
      const mode = $("mode").value;
      $("date").hidden = mode !== "date";
      $("count").hidden = mode !== "random";
      $("start").hidden = mode !== "range";
      $("end").hidden = mode !== "range";
    });

    $("load").addEventListener("click", load);
    load(); // load today's picture on page open
  </script>
</body>
</html>
